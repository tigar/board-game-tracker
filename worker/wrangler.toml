name = "board-game-tracker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "board-game-tracker-db"
database_id = "local-db-id"

# Environment variables
[vars]
API_KEY = "dev-api-key-change-in-production"

# For local development
[env.dev]
name = "board-game-tracker-dev"

# For production deployment
[env.production]
name = "board-game-tracker"
